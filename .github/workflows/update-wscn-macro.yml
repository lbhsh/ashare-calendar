name: Update WSCN macro ICS (legacy)

on:
  # Schedule disabled — too noisy for daily use. Prefer ashare_important.ics.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch WSCN macro → wscn_macro.ics
        run: python3 fetch_wscn_macro.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wscn_macro.ics
          if git diff --staged --quiet; then
            echo "No changes to wscn_macro.ics"
          else
            git commit -m "chore: refresh wscn_macro.ics from Wall Street CN API (legacy)"
            git push
          fi
