name: Update East Money calendar ICS

on:
  schedule:
    # 01:00 UTC = 09:00 Asia/Shanghai (after WSCN job)
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch East Money → eastmoney_calendar.ics
        run: python3 fetch_eastmoney_calendar.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eastmoney_calendar.ics
          if git diff --staged --quiet; then
            echo "No changes to eastmoney_calendar.ics"
          else
            git commit -m "chore: refresh eastmoney_calendar.ics from East Money dstx API"
            git push
          fi
