name: Update A-share important ICS

on:
  schedule:
    # 00:40 UTC = 08:40 Asia/Shanghai
    - cron: "40 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build ashare_important.ics
        run: python3 build_ashare_important.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ashare_important.ics
          if git diff --staged --quiet; then
            echo "No changes to ashare_important.ics"
          else
            git commit -m "chore: refresh ashare_important.ics (curated + CN high-impact macro)"
            git push
          fi
